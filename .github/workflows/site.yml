name: Site

# Rebuilds the page from live data and publishes it to GitHub Pages. Daily, so prices and
# injury flags stay fresh before each deadline; past seasons come from the cache.
# Pages must be enabled with "GitHub Actions" as the source (Settings -> Pages).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Cache past seasons
        uses: actions/cache@v4
        with:
          path: data/cache/football-data
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-
      - name: Build the page
        run: epl site --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
